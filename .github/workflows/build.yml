name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DGS_FORMATS="AU;VST3;Standalone"
      - name: Build
        run: cmake --build build --config Release -- -quiet
      - name: Package
        run: |
          mkdir -p out
          cp -R build/GranularSystem_artefacts/Release/AU/*.component out/
          cp -R build/GranularSystem_artefacts/Release/VST3/*.vst3 out/
          cp -R build/GranularSystem_artefacts/Release/Standalone/*.app out/
          codesign --force --deep -s - out/*.component out/*.vst3 out/*.app
      - uses: actions/upload-artifact@v4
        with:
          name: GRANULAR_SYSTEM-macOS
          path: out
      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R out/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Gsy1 Grsy

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DGS_FORMATS="VST3;Standalone"
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: GRANULAR_SYSTEM-Windows
          path: |
            build/GranularSystem_artefacts/Release/VST3
            build/GranularSystem_artefacts/Release/Standalone
